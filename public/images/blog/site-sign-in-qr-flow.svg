<rect x="32" y="40" width="216" height="268" rx="10" fill="#161D2E" stroke="#263047"/>
<text x="56" y="72" fill="#F97316" font-size="12" font-weight="800" letter-spacing="1.5">STEP 1</text>
<rect x="70" y="88" width="140" height="150" rx="8" fill="#F3F4F6"/>
<text x="140" y="108" fill="#0F1420" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">SCAN TO SIGN IN</text>

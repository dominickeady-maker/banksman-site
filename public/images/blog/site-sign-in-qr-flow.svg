<title id="t">How QR code site sign-in works</title>
<desc id="d">Three steps: a laminated QR poster on the site gate, a worker scanning it with their phone camera to sign in, and the manager's live dashboard showing 6 on site now at Plot 4, Marsden Road.</desc>

<rect x="102" y="128" width="10" height="10"/><rect x="168" y="128" width="10" height="10"/><rect x="102" y="194" width="10" height="10"/>
<rect x="130" y="120" width="8" height="8"/><rect x="142" y="132" width="8" height="8"/><rect x="130" y="144" width="8" height="8"/><rect x="130" y="160" width="8" height="8"/><rect x="146" y="164" width="8" height="8"/><rect x="164" y="160" width="8" height="8"/><rect x="178" y="170" width="8" height="8"/><rect x="132" y="186" width="8" height="8"/><rect x="148" y="196" width="8" height="8"/><rect x="164" y="186" width="8" height="8"/><rect x="176" y="200" width="8" height="8"/><rect x="134" y="206" width="8" height="8"/><rect x="96" y="164" width="8" height="8"/><rect x="110" y="170" width="8" height="8"/></g>
<text x="140" y="230" fill="#0F1420" font-size="10" text-anchor="middle">Plot 4, Marsden Road</text>
<text x="140" y="270" fill="#F3F4F6" font-size="15" font-weight="700" text-anchor="middle">QR poster on the gate</text>
<text x="140" y="290" fill="#9CA3AF" font-size="12" text-anchor="middle">Laminated, one per site</text>
<line x1="254" y1="174" x2="284" y2="174" stroke="#F97316" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="292" y="40" width="216" height="268" rx="10" fill="#161D2E" stroke="#263047"/>

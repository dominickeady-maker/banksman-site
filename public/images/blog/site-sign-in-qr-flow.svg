<text x="626" y="124" fill="#F3F4F6" font-size="13" font-weight="700">On site now</text>
<text x="626" y="142" fill="#9CA3AF" font-size="11">Plot 4, Marsden Road</text>
<g fill="#9CA3AF" font-size="11"><circle cx="596" cy="172" r="4" fill="#22C55E"/><text x="608" y="176">Sarah · bricklayer</text><circle cx="596" cy="194" r="4" fill="#22C55E"/><text x="608" y="198">Dan · groundworks</text><circle cx="596" cy="216" r="4" fill="#22C55E"/><text x="608" y="220">+ 4 more</text></g>
<text x="660" y="270" fill="#F3F4F6" font-size="15" font-weight="700" text-anchor="middle">Live headcount</text>
<text x="660" y="290" fill="#9CA3AF" font-size="12" text-anchor="middle">For the manager, any site</text>
<text x="400" y="348" fill="#9CA3AF" font-size="13" text-anchor="middle">Scan in at the gate, scan out at the end of the day. The register keeps itself.</text>
</g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

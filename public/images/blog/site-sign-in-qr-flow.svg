<rect x="352" y="84" width="96" height="164" rx="16" fill="#0F1420" stroke="#263047" stroke-width="3"/>
<rect x="366" y="104" width="68" height="68" rx="6" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="10 6"/>
<circle cx="400" cy="200" r="15" fill="#22C55E"/><path d="M393 200l5 5 9-10" stroke="#0F1420" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<text x="400" y="234" fill="#F3F4F6" font-size="10" font-weight="700" text-anchor="middle">Signed in 07:28</text>
<text x="400" y="270" fill="#F3F4F6" font-size="15" font-weight="700" text-anchor="middle">Scan with the camera</text>
<text x="400" y="290" fill="#9CA3AF" font-size="12" text-anchor="middle">No app store download</text>
<line x1="514" y1="174" x2="544" y2="174" stroke="#F97316" stroke-width="2.5" marker-end="url(#a)"/>

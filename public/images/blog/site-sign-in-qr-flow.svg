<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F97316"/></marker></defs>
<rect width="800" height="380" fill="#0F1420"/><rect width="800" height="380" fill="url(#g)"/>

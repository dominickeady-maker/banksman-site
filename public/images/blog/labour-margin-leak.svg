<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">How a 20% quoted margin shrinks to 3%</title>
<desc id="d">A bar showing a 20% quoted profit margin losing 7 points to untracked client extras, 6 points to split site days and travel, and 4 points to late snagging, leaving 3% actual margin.</desc>
<defs><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1C2333" stroke-width="1"/></pattern></defs>
<rect width="800" height="380" fill="#0F1420"/><rect width="800" height="380" fill="url(#g)"/>
<g font-family="Inter, system-ui, sans-serif">
<rect x="40" y="28" width="720" height="324" rx="10" fill="#161D2E" stroke="#263047"/>
<text x="66" y="64" fill="#F3F4F6" font-size="20" font-weight="700">Where the margin went</text>
<text x="66" y="86" fill="#9CA3AF" font-size="13">Example job when timesheets aren't tied to the site budget</text>
<g font-size="14">
<text x="66" y="132" fill="#F3F4F6" font-weight="700">Quoted margin</text>
<rect x="290" y="116" width="400" height="22" rx="6" fill="#22C55E"/><text x="704" y="133" fill="#F3F4F6" font-weight="700">20%</text>
<text x="66" y="178" fill="#9CA3AF">Client extras not billed</text>
<rect x="550" y="162" width="140" height="22" rx="6" fill="#F97316"/><text x="704" y="179" fill="#F97316" font-weight="700">−7</text>
<text x="66" y="224" fill="#9CA3AF">Split site days and travel</text>
<rect x="430" y="208" width="120" height="22" rx="6" fill="#F97316" fill-opacity=".8"/><text x="704" y="225" fill="#F97316" font-weight="700">−6</text>
<text x="66" y="270" fill="#9CA3AF">Late snagging visits</text>
<rect x="350" y="254" width="80" height="22" rx="6" fill="#F97316" fill-opacity=".6"/><text x="704" y="271" fill="#F97316" font-weight="700">−4</text>
<line x1="66" y1="296" x2="734" y2="296" stroke="#263047"/>
<text x="66" y="326" fill="#F3F4F6" font-weight="700">Actual margin</text>
<rect x="290" y="310" width="60" height="22" rx="6" fill="#9CA3AF"/><text x="704" y="327" fill="#F3F4F6" font-weight="700">3%</text>
</g>
<g stroke="#263047" stroke-dasharray="4 4"><line x1="550" y1="140" x2="550" y2="162"/><line x1="430" y1="186" x2="430" y2="208"/><line x1="350" y1="232" x2="350" y2="254"/></g>
</g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

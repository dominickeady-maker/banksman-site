<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Unlogged text order compared with a logged order</title>
<desc id="d">An unlogged text order leads to a £480 duplicate drop and a missing credit. A logged order with a delivery note photo has no waste and matches the merchant invoice straight away.</desc>
<defs><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1C2333" stroke-width="1"/></pattern></defs>
<rect width="800" height="380" fill="#0F1420"/><rect width="800" height="380" fill="url(#g)"/>
<g font-family="Inter, system-ui, sans-serif">
<rect x="32" y="32" width="356" height="316" rx="10" fill="#161D2E" stroke="#263047"/>
<rect x="54" y="54" width="128" height="26" rx="13" fill="#F97316" fill-opacity=".15" stroke="#F97316"/>
<text x="118" y="72" fill="#F97316" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1.2">UNLOGGED</text>
<text x="54" y="114" fill="#F3F4F6" font-size="20" font-weight="700">Order sent by text</text>
<rect x="54" y="132" width="250" height="40" rx="10" fill="#263047"/><text x="68" y="157" fill="#F3F4F6" font-size="13">"Can u order plasterboard for Mon"</text>
<rect x="84" y="182" width="250" height="40" rx="10" fill="#263047"/><text x="98" y="207" fill="#F3F4F6" font-size="13">"Already done mate, came Fri?"</text>
<g font-size="13"><text x="54" y="254" fill="#9CA3AF">Ordered twice</text><text x="366" y="254" fill="#F3F4F6" text-anchor="end" font-weight="700">£480 duplicate drop</text>
<text x="54" y="282" fill="#9CA3AF">Short delivery</text><text x="366" y="282" fill="#F3F4F6" text-anchor="end" font-weight="700">credit never claimed</text>
<text x="54" y="310" fill="#9CA3AF">Who signed for it?</text><text x="366" y="310" fill="#F97316" text-anchor="end" font-weight="700">nobody knows</text></g>
<rect x="412" y="32" width="356" height="316" rx="10" fill="#161D2E" stroke="#263047"/>
<rect x="434" y="54" width="110" height="26" rx="13" fill="#22C55E" fill-opacity=".15" stroke="#22C55E"/>
<text x="489" y="72" fill="#22C55E" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1.2">LOGGED</text>
<text x="434" y="114" fill="#F3F4F6" font-size="20" font-weight="700">Order tracked to the gate</text>
<rect x="434" y="132" width="312" height="90" rx="10" fill="#0F1420" stroke="#263047"/>
<text x="450" y="157" fill="#F3F4F6" font-size="13" font-weight="700">12x 12.5mm plasterboard</text><text x="450" y="177" fill="#9CA3AF" font-size="12">Station Road · approved · ref MER-20388</text>
<rect x="450" y="190" width="280" height="8" rx="4" fill="#263047"/><rect x="450" y="190" width="280" height="8" rx="4" fill="#F97316"/>
<g font-size="13"><text x="434" y="254" fill="#9CA3AF">Duplicate orders</text><text x="746" y="254" fill="#22C55E" text-anchor="end" font-weight="700">£0 waste</text>
<text x="434" y="282" fill="#9CA3AF">Delivery note</text><text x="746" y="282" fill="#F3F4F6" text-anchor="end" font-weight="700">photo on the order</text>
<text x="434" y="310" fill="#9CA3AF">Merchant invoice</text><text x="746" y="310" fill="#22C55E" text-anchor="end" font-weight="700">instant match</text></g>
</g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Quoted labour budget against live labour spend for three sites</title>
<desc id="d">Three sites compared: Mill Lane Barn has spent £8,400 of a £12,000 labour budget (70%), Plot 4 Marsden Road £5,100 of £9,000 (57%), and Station Road £9,850 of £10,000 (98.5%) with an alert.</desc>
<defs><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1C2333" stroke-width="1"/></pattern></defs>
<rect width="800" height="380" fill="#0F1420"/><rect width="800" height="380" fill="url(#g)"/>
<g font-family="Inter, system-ui, sans-serif">
<rect x="40" y="28" width="720" height="324" rx="10" fill="#161D2E" stroke="#263047"/>
<text x="66" y="64" fill="#F3F4F6" font-size="20" font-weight="700">Labour: quoted vs spent to date</text>
<text x="66" y="86" fill="#9CA3AF" font-size="13">Approved hours × each worker's rate · week ending Friday</text>
<line x1="66" y1="106" x2="734" y2="106" stroke="#263047"/>
<g>
<text x="66" y="140" fill="#F3F4F6" font-size="15" font-weight="700">Mill Lane Barn</text>
<text x="734" y="140" fill="#9CA3AF" font-size="13" text-anchor="end"><tspan fill="#F3F4F6" font-weight="700">£8,400</tspan> / £12,000 (70%)</text>
<rect x="66" y="152" width="668" height="12" rx="6" fill="#263047"/><rect x="66" y="152" width="468" height="12" rx="6" fill="#F97316"/>
</g>
<g>
<text x="66" y="206" fill="#F3F4F6" font-size="15" font-weight="700">Plot 4, Marsden Road</text>
<text x="734" y="206" fill="#9CA3AF" font-size="13" text-anchor="end"><tspan fill="#F3F4F6" font-weight="700">£5,100</tspan> / £9,000 (57%)</text>
<rect x="66" y="218" width="668" height="12" rx="6" fill="#263047"/><rect x="66" y="218" width="381" height="12" rx="6" fill="#F97316"/>
</g>
<g>
<text x="66" y="272" fill="#F3F4F6" font-size="15" font-weight="700">Station Road</text>
<rect x="176" y="257" width="72" height="22" rx="11" fill="#F97316" fill-opacity=".18" stroke="#F97316"/><text x="212" y="272" fill="#F97316" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1.2">ALERT</text>
<text x="734" y="272" fill="#9CA3AF" font-size="13" text-anchor="end"><tspan fill="#F3F4F6" font-weight="700">£9,850</tspan> / £10,000 (98.5%)</text>
<rect x="66" y="284" width="668" height="12" rx="6" fill="#263047"/><rect x="66" y="284" width="658" height="12" rx="6" fill="#F97316"/>
<text x="66" y="324" fill="#9CA3AF" font-size="12">Roof, second fix and snagging still to do. Time to find the extras and bill them.</text>
</g>
</g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

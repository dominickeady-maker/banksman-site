# Decap CMS: https://decapcms.org/docs/configuration-options/
# Login uses GitHub via Netlify's OAuth provider (see BLOG_GUIDE.md, "Admin login").
backend:
  name: github
  repo: dominickeady-maker/banksman-site
  branch: main
  commit_messages:
    create: 'Blog: create “{{slug}}”'
    update: 'Blog: update “{{slug}}”'
    delete: 'Blog: delete “{{slug}}”'
    uploadMedia: 'Blog: upload “{{path}}”'
    deleteMedia: 'Blog: delete “{{path}}”'

# Each post is saved as a pull request until it is published from the Workflow tab.
# Publish = live: /admin/index.html clears the post's `draft` flag on every save, so
# whatever Decap publishes appears on banksman.app. Posts still marked draft from before
# show as DRAFT in the list; open one, set the publish date, Save, then Publish.
publish_mode: editorial_workflow

site_url: https://banksman.app
display_url: https://banksman.app
logo_url: /assets/banksman-icon.svg

media_folder: public/images/blog
public_folder: /images/blog

collections:
  - name: blog
    label: Blog posts
    label_singular: Blog post
    folder: src/content/blog
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    preview_path: 'blog/{{slug}}/'
    summary: "{{fields.draft | ternary('DRAFT (hidden from the site)', 'LIVE on the site')}} · {{title}} {{author}} · {{pubDate | date('D MMM YYYY')}}"
    sortable_fields: ['pubDate', 'title', 'author']
    view_filters:
      - { label: 'Draft (hidden from the site)', field: draft, pattern: true }
      - { label: 'Live on the site', field: draft, pattern: false }
    fields:
      # Lengths here match the site's rules (src/content.config.ts). A post outside them would stop the site building.
      - { name: title, label: Title, widget: string, pattern: ['^[\s\S]{10,90}$', 'Keep the title between 10 and 90 characters.'], hint: 'Shown as the page H1. 10 to 90 characters. Do not repeat it in the body.' }
      - { name: seoTitle, label: Google title, widget: string, required: false, pattern: ['^[\s\S]{10,60}$', 'Keep the Google title between 10 and 60 characters, or leave it empty.'], hint: 'Shorter title for Google results, 10 to 60 characters. Leave empty to use the title.' }
      - { name: description, label: Meta description, widget: text, pattern: ['^[\s\S]{50,170}$', 'Keep the description between 50 and 170 characters (about two short sentences).'], hint: '50 to 170 characters. Shown in Google and when the link is shared.' }
      - { name: keyword, label: Target keyword, widget: string, pattern: ['^[\s\S]{3,}$', 'Add a search phrase of at least 3 characters.'], hint: 'The search phrase this post is written for. Use it in the title or first paragraph.' }
      - { name: author, label: Author, widget: string, default: Matt }
      - { name: category, label: Category, widget: string, default: Site management, hint: 'Shown above the title and on the blog card.' }
      - { name: pubDate, label: Publish date, widget: datetime, default: '{{now}}', format: 'YYYY-MM-DD', date_format: 'DD/MM/YYYY', time_format: false, picker_utc: true, hint: 'The day the post goes live. Pick today to publish straight away, or a future date to schedule it: publish as normal and it appears on the site early that morning.' }
      - { name: updatedDate, label: Updated date, widget: datetime, format: 'YYYY-MM-DD', date_format: 'DD/MM/YYYY', time_format: false, picker_utc: true, required: false }
      # Set automatically: saving in /admin/ clears it, so Publish puts the post live (see /admin/index.html).
      - { name: draft, label: Draft, widget: hidden, default: false }
      - { name: image, label: Share image, widget: image, required: false, choose_url: false, media_library: { config: { max_file_size: 2000000 } }, hint: '1200×630, JPG, PNG or WebP. Leave empty to use the generated share image.' }
      - { name: imageAlt, label: Share image alt text, widget: string, required: false }
      - { name: cover, label: Cover picture, widget: image, required: false, choose_url: false, media_library: { config: { max_file_size: 2000000 } }, hint: '1200×675 (16:9), JPG, PNG or WebP, under 2 MB. Click "Choose an image" here to upload it, so you never leave the post. Leave empty to use /assets/blog/<file-name>.webp.' }
      - { name: coverAlt, label: Cover picture description (alt text), widget: string, required: false, pattern: ['^[\s\S]{10,160}$', 'Describe the picture in 10 to 160 characters.'], hint: 'One plain sentence saying what the picture shows, for screen readers and Google Images. 10 to 160 characters.' }
      - name: faq
        label: FAQ
        widget: list
        required: false
        summary: '{{fields.question}}'
        hint: 'Shown at the end of the post and sent to Google as FAQ structured data.'
        fields:
          - { name: question, label: Question, widget: string, pattern: ['^[\s\S]{5,}$', 'Write a question of at least 5 characters.'] }
          - { name: answer, label: Answer, widget: text, pattern: ['^[\s\S]{5,}$', 'Write an answer of at least 5 characters.'] }
      - { name: body, label: Body, widget: markdown, hint: 'Start with a direct answer paragraph, then ## sections. No # heading.' }
